name: Verify redistributed models

# The UML READMEs make three checkable claims about the committed models: that each
# .scxml is the zip's ModelExport.xml with CRLF converted to LF, that both files have the
# published SHA-256, and that the .scxml is stored with LF endings. A checkout on a CRLF
# platform could otherwise re-commit a file that no longer matches its own documentation.
#
# A fourth claim is the one everything else rests on: that each .scxml is the same model as
# the ASAM Enterprise Architect project it was exported from. The model-equivalence job
# proves it fact by fact, against the .qeax read as the SQLite database it is.
#
# The fifth is that the model is a model of the normative schema at all. The
# xsd-transformation job derives each XSD from the EA project and from the SCXML - for
# OpenSCENARIO with ASAM's own generator, which the project contains - and compares the result
# with the published schema.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "standards/*/uml/**"
      - "standards/*/schema/**"
      - ".gitattributes"
      - ".github/workflows/verify-models.yml"
      - "scripts/model_equivalence.py"
      - "scripts/check_model_equivalence.py"
      - "scripts/test_model_equivalence.py"
      - "scripts/generate_semantic_artifacts.py"
      - "pipeline/*-model-equivalence-baseline.json"
      - "scripts/ea_api.py"
      - "scripts/osc_xsd_transformation.py"
      - "scripts/odr_xsd_transformation.py"
      - "scripts/xsd_equivalence.py"
      - "scripts/check_xsd_transformation.py"
      - "scripts/test_xsd_transformation.py"
      - "pipeline/*-xsd-transformation-baseline.json"
      - "scripts/shacl_equivalence.py"
      - "scripts/check_shacl_equivalence.py"
      - "scripts/test_shacl_equivalence.py"
      - "scripts/candidate_model.py"
      - "pipeline/*-shacl-equivalence-baseline.json"
      - "standards/*/candidates/**"
      - "standards/*/generated/**"

jobs:
  scxml-matches-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .scxml equals the zip entry after CRLF -> LF
        run: |
          set -euo pipefail
          found=0
          for scxml in standards/*/uml/*.scxml; do
            zip="${scxml}.zip"
            [ -f "$zip" ] || { echo "::error::missing $zip"; exit 1; }
            unzip -p "$zip" > /tmp/entry.xml
            tr -d '\r' < /tmp/entry.xml > /tmp/entry.lf.xml
            if ! cmp -s /tmp/entry.lf.xml "$scxml"; then
              echo "::error file=$scxml::differs from $zip after CRLF -> LF conversion"
              exit 1
            fi
            echo "ok: $scxml == $(basename "$zip"):ModelExport.xml (LF-normalised)"
            found=$((found + 1))
          done
          [ "$found" -gt 0 ] || { echo "::error::no .scxml models found to check"; exit 1; }
          echo "checked $found model(s)"

      - name: .scxml is stored with LF endings
        run: |
          set -euo pipefail
          for scxml in standards/*/uml/*.scxml; do
            cr=$(tr -cd '\r' < "$scxml" | wc -c)
            [ "$cr" -eq 0 ] || { echo "::error file=$scxml::contains $cr CR bytes"; exit 1; }
            echo "ok: $scxml is LF-only"
          done

      - name: Published SHA-256 checksums still match
        run: |
          set -euo pipefail
          # Each uml/README.md tabulates the truncated SHA-256 of the .scxml and the .zip.
          # Recompute and require the published prefix to appear in the README.
          for readme in standards/*/uml/README.md; do
            dir=$(dirname "$readme")
            for artifact in "$dir"/*.scxml "$dir"/*.scxml.zip; do
              actual=$(sha256sum "$artifact" | cut -c1-16)
              if ! grep -qF "$actual" "$readme"; then
                echo "::error file=$readme::$(basename "$artifact") has SHA-256 ${actual}… which is not documented"
                exit 1
              fi
              echo "ok: $(basename "$artifact") -> ${actual}… documented"
            done
          done

  # Same claim, made about ASAM's normative schemas rather than the UML exports, and it needs
  # enforcing for a sharper reason: those checksums cover the deliverables byte-for-byte *as
  # ASAM shipped them*, line endings included. Several OpenDRIVE files are stored with CRLF and
  # OpenSCENARIO's with LF, so any well-meaning normalisation - a .gitattributes change, an
  # editor, a pre-commit hook - silently makes them unverifiable against the published
  # deliverable. Downstream consumers copy these files expecting exactly those bytes; see the
  # derived vocabularies in ontology-management-base's imports/.
  schema-checksums:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # *.qeax is stored in Git LFS. Without this the checkout yields ~130-byte pointer
          # files, the step below hashes the pointers, and the job passes without ever having
          # looked at an ASAM deliverable.
          lfs: true

      - name: Published schema SHA-256 checksums still match
        run: |
          set -euo pipefail
          found=0
          for readme in standards/*/schema/README.md; do
            dir=$(dirname "$readme")
            for artifact in "$dir"/*.xsd; do
              actual=$(sha256sum "$artifact" | cut -c1-16)
              if ! grep -qF "$actual" "$readme"; then
                echo "::error file=$readme::$(basename "$artifact") has SHA-256 ${actual}… which is not documented. If line endings were normalised, restore the bytes ASAM published rather than updating this checksum."
                exit 1
              fi
              echo "ok: $(basename "$artifact") -> ${actual}… documented"
              found=$((found + 1))
            done
          done
          [ "$found" -gt 0 ] || { echo "::error::no schema files found to check"; exit 1; }
          echo "checked $found schema file(s)"

      - name: Every schema directory publishes its provenance
        run: |
          set -euo pipefail
          # A schema directory without a README is a redistributed ASAM deliverable with no
          # record of where it came from, and the step above would silently check nothing.
          for dir in standards/*/schema; do
            [ -n "$(find "$dir" -maxdepth 1 -name '*.xsd' -print -quit)" ] || continue
            [ -f "$dir/README.md" ] || { echo "::error::$dir holds schemas but no README.md recording their provenance"; exit 1; }
            echo "ok: $dir/README.md present"
          done

      # The Enterprise Architect projects are the root input of the entire pipeline: the SCXML
      # models, and therefore the OWL, SHACL and generated XSD, all derive from these bytes.
      # They are redistributed verbatim under the same clause as the schemas, so they get the
      # same treatment - a published checksum that CI re-verifies.
      - name: Committed EA projects still match their published checksums
        run: |
          set -euo pipefail
          found=0
          for readme in standards/*/uml/source/README.md; do
            dir=$(dirname "$readme")
            for artifact in "$dir"/*.qeax; do
              # A pointer file means the LFS checkout above did not take effect. Hashing it
              # would "pass" against nothing, so fail loudly instead.
              if head -c 40 "$artifact" | grep -q 'git-lfs.github.com'; then
                echo "::error file=$artifact::is a Git LFS pointer, not the model. The checkout needs lfs: true."
                exit 1
              fi
              actual=$(sha256sum "$artifact" | cut -c1-16)
              if ! grep -qF "$actual" "$readme"; then
                echo "::error file=$readme::$(basename "$artifact") has SHA-256 ${actual}… which is not documented. Restore the bytes ASAM published rather than updating this checksum."
                exit 1
              fi
              echo "ok: $(basename "$artifact") -> ${actual}… documented"
              found=$((found + 1))
            done
          done
          [ "$found" -gt 0 ] || { echo "::error::no EA projects found to check"; exit 1; }
          echo "checked $found EA project(s)"

  # The export from the EA project to SCXML is the only step that needs an Enterprise
  # Architect licence, so its output is committed and everything downstream trusts it. This
  # re-reads both files - the .qeax with sqlite3, the .scxml with xml.etree, no EA and no
  # ShapeChange - and fails on any difference outside the recorded baseline, or on a baseline
  # entry that no longer occurs. See pipeline/README.md, "Checking it: equivalence with ASAM's
  # EA project".
  model-equivalence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Without LFS the .qeax is a ~130-byte pointer. The check refuses it rather than
          # comparing nothing, but it cannot compare anything either.
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # The comparison is the proof the rest of the pipeline builds on, so it is tested on its
      # own first: a faithful export must yield no finding, and every loss the committed
      # exports actually have must be detected.
      - name: The model-equivalence comparison behaves as specified
        run: python scripts/test_model_equivalence.py
      - name: Each SCXML model is its EA project, except for the recorded differences
        run: python scripts/check_model_equivalence.py --strict-baseline

  xsd-transformation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The XSD derivation and comparison behave as specified
        run: python scripts/test_xsd_transformation.py
      # Fails unless ASAM's OpenSCENARIO generator, ported, reproduces the published schema
      # byte for byte from the EA project, and unless every other difference - OpenDRIVE's
      # from its project, both standards' from their SCXML - is in the baseline.
      - name: Each normative XSD is what its model derives, except for the recorded differences
        run: python scripts/check_xsd_transformation.py --strict-baseline
      - name: Each candidate model and changelog is its release plus its changes.json
        run: python scripts/candidate_model.py
      - name: Install the pinned serialization stack
        run: pip install -r scripts/requirements.txt
      - name: The SHACL comparison behaves as specified
        run: python scripts/test_shacl_equivalence.py
      - name: The committed SHACL constrains what the model's schema does, except the recorded
        run: python scripts/check_shacl_equivalence.py --strict-baseline
